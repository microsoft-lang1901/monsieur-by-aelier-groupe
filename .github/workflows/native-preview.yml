name: Native Preview Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to build
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run import:catalogue && npm run verify

      - name: Assert Expo token
        run: node -e "if (!process.env.EXPO_TOKEN) throw new Error('Missing EXPO_TOKEN repository secret')"

      - name: Build native preview
        run: npx eas build --profile preview --platform ${{ inputs.platform }} --non-interactive

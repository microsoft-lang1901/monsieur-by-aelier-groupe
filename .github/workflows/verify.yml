name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - release/**

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Import catalogue
        run: npm run import:catalogue

      - name: Verify
        run: npm run verify

      - name: Supabase policies
        run: npm run lint:supabase

      - name: Web export
        run: npm run build:web

      - name: Production env gate documentation
        run: npm run validate:env
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
          STRIPE_SECRET_KEY: sk_test_ci_placeholder

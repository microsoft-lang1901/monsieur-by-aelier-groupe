<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout  - Monsieur</title>
<link rel="stylesheet" href="monsieur.css" />
<style>
.co { padding: 30px 0 90px; }
.crumb { font-family: var(--sans); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin-bottom: 16px; display: flex; gap: 9px; }
.crumb a:hover { color: var(--ink-2); } .crumb b { color: var(--ink-2); font-weight: 400; }
.co h1 { font-family: var(--serif); font-weight: 500; font-size: 42px; color: var(--ink); }
.co .step { font-family: var(--sans); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
.co-grid { display: grid; grid-template-columns: 1fr 420px; gap: 40px; align-items: start; margin-top: 40px; }

.block { margin-bottom: 34px; }
.block h3 { font-family: var(--sans); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
.pm { display: grid; gap: 11px; }
.pm-opt { display: flex; align-items: center; gap: 14px; padding: 17px 20px; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; background: var(--card); transition: all .18s; }
.pm-opt:hover { border-color: var(--line-strong); }
.pm-opt.on { border-color: var(--dark); background: var(--card-2); }
.pm-opt .rd { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line-strong); flex: none; display: grid; place-items: center; }
.pm-opt.on .rd { border-color: var(--dark); } .pm-opt.on .rd::after { content:''; width: 8px; height: 8px; border-radius: 50%; background: var(--dark); }
.pm-opt .nm { font-family: var(--read); font-size: 15px; color: var(--ink); flex: 1; }
.pm-opt .logos { display: flex; gap: 7px; align-items: center; }
.pm-opt .pill { font-family: var(--sans); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 8px; border-radius: 3px; background: var(--dark); color: var(--on-dark); }
.pm-opt .pill.alt { background: transparent; color: var(--muted); border: 1px solid var(--line); }

.field { margin-bottom: 15px; }
.field label { display: block; font-family: var(--sans); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.field input { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 3px; padding: 13px 15px; font-family: var(--sans); font-size: 14px; font-weight: 300; color: var(--ink); outline: none; transition: border-color .18s; }
.field input:focus { border-color: var(--line-strong); }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.card-fields { display: none; padding-top: 6px; }
.card-fields.show { display: block; }

/* summary */
.summary { background: var(--card); border: 1px solid var(--line-soft); border-radius: 4px; padding: 28px 30px; position: sticky; top: 100px; }
.summary h3 { font-family: var(--sans); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; }
.line-item { display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line-soft); }
.line-item:first-of-type { border-top: none; padding-top: 0; }
.line-item .sw { width: 56px; height: 70px; border-radius: 3px; overflow: hidden; position: relative; flex: none; border: 1px solid var(--line-soft); }
.line-item .sw .t { position: absolute; inset: 0; }
.line-item .li { flex: 1; }
.line-item .li .nm { font-family: var(--read); font-size: 14.5px; color: var(--ink); }
.line-item .li .mt { font-family: var(--read); font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.line-item .pr { font-family: var(--serif); font-size: 16px; font-weight: 600; color: var(--ink); }
.totals { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
.totals .tr { display: flex; justify-content: space-between; font-family: var(--read); font-size: 14px; color: var(--ink-2); padding: 6px 0; }
.totals .tr .free { color: var(--bronze); }
.totals .grand { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.totals .grand .gl { font-family: var(--sans); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.totals .grand .gv { font-family: var(--serif); font-size: 26px; font-weight: 600; color: var(--ink); }
.pay-btn { margin-top: 22px; }
.terms { font-family: var(--read); font-size: 12px; color: var(--muted); text-align: center; margin-top: 14px; line-height: 1.5; }
.terms a { color: var(--bronze); text-decoration: underline; }

@media (max-width: 1080px) { .co-grid { grid-template-columns: 1fr; } .summary { position: static; } }
</style>
</head>
<body>

<div id="m-header" data-active=""></div>

<main class="wrap co">
  <div class="crumb"><a href="wardrobe.html">Wardrobe</a><span>/</span><b>Checkout</b></div>
  <h1>Checkout</h1>
  <div class="step">Payment · Step 2 of 3</div>

  <div class="co-grid">
    <div>
      <div class="block">
        <h3>Payment Method</h3>
        <div class="pm">
          <div class="pm-opt on" data-pm="apple">
            <span class="rd"></span><span class="nm">Apple&nbsp;Pay</span>
            <span class="logos"><span class="pill">Pay</span></span>
          </div>
          <div class="pm-opt" data-pm="card">
            <span class="rd"></span><span class="nm">Credit or Debit Card</span>
            <span class="logos"><span class="pill alt">VISA</span><span class="pill alt">MC</span></span>
          </div>
          <div class="pm-opt" data-pm="other">
            <span class="rd"></span><span class="nm">Other Payment Methods</span>
          </div>
        </div>
        <div class="card-fields" id="cardFields">
          <div class="field"><label>Cardholder Name</label><input type="text" placeholder="Mr. Alexandre Moreau" /></div>
          <div class="field"><label>Card Number</label><input type="text" placeholder="0000 - 0000 - 0000 - 0000" /></div>
          <div class="f2">
            <div class="field"><label>Expiry</label><input type="text" placeholder="MM / YY" /></div>
            <div class="field"><label>CVC</label><input type="text" placeholder="000" /></div>
          </div>
        </div>
      </div>

      <div class="block">
        <h3>Shipping Address</h3>
        <div class="field"><label>Full Name</label><input type="text" value="Alexandre Moreau" /></div>
        <div class="field"><label>Address</label><input type="text" placeholder="Street address" /></div>
        <div class="f2">
          <div class="field"><label>City</label><input type="text" placeholder="City" /></div>
          <div class="field"><label>Postal Code</label><input type="text" placeholder="Postal code" /></div>
        </div>
      </div>
    </div>

    <aside class="summary">
      <h3>Order Summary</h3>
      <div id="items"></div>
      <div class="totals">
        <div class="tr"><span>Subtotal</span><span id="subtotal">$0</span></div>
        <div class="tr"><span>Shipping</span><span class="free">Complimentary</span></div>
        <div class="tr"><span>Tax</span><span>$0</span></div>
        <div class="grand"><span class="gl">Total</span><span class="gv" id="total">$0</span></div>
      </div>
      <button class="btn btn-dark btn-block pay-btn" id="pay">Pay with Apple Pay</button>
      <p class="terms">By placing your order, you agree to our <a href="house.html">Terms &amp; Conditions</a>.</p>
    </aside>
  </div>
</main>

<div id="m-footer"></div>

<script src="monsieur-data.js"></script>
<script src="chrome.js"></script>
<script src="backend-client.js"></script>
<script>
const isDark = t => t.includes('navy')||t.includes('black')||t.includes('charcoal')||t.includes('brown')||t.includes('olive');
let items = MN.getWard();
if (!items.length) { const g = GARMENTS[0]; items = [{id:g.id,name:g.name,house:g.house,tone:g.tone,material:g.material,price:g.price}]; }

document.getElementById('items').innerHTML = items.map(it=>`
  <div class="line-item">
    <span class="sw">${it.editorial&&it.editorial[0]?`<img class="editorial-img" src="${it.editorial[0].src}" alt="${it.name} ${it.editorial[0].label}" loading="lazy" />`:`<span class="t ${isDark(it.tone)?'photo':'tex'} ${it.tone}"></span>`}</span>
    <div class="li"><div class="nm">${it.name}</div><div class="mt">${it.material} · Qty 1</div></div>
    <span class="pr">${fmtPrice(it.price)}</span>
  </div>`).join('');
const subtotal = items.reduce((s,i)=>s+i.price,0);
document.getElementById('subtotal').textContent = fmtPrice(subtotal);
document.getElementById('total').textContent = fmtPrice(subtotal);

let pm = 'apple';
document.querySelectorAll('.pm-opt').forEach(o=>o.addEventListener('click',()=>{
  pm = o.dataset.pm;
  document.querySelectorAll('.pm-opt').forEach(x=>x.classList.toggle('on',x===o));
  document.getElementById('cardFields').classList.toggle('show', pm==='card');
  const label = pm==='apple'?'Pay with Apple Pay':pm==='card'?'Pay Securely':'Continue to Payment';
  document.getElementById('pay').textContent = label;
}));
document.getElementById('pay').addEventListener('click',()=>{
  toast('Order confirmed  - thank you, Mr. Moreau');
  setTimeout(()=>location.href='dossier.html',1300);
});
</script>
</body>
</html>

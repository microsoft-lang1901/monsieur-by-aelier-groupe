<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Private Client Dossier  - Monsieur</title>
<link rel="stylesheet" href="monsieur.css" />
<style>
.dbanner { background: var(--dark); color: var(--on-dark); }
.dbanner .wrap { padding: 54px 44px 48px; display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; flex-wrap: wrap; }
.dbanner .pclabel { font-family: var(--sans); font-size: 10.5px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--bronze-soft); }
.dbanner h1 { font-family: var(--serif); font-weight: 500; font-size: 50px; line-height: 1; color: var(--on-dark); margin: 14px 0 10px; }
.dbanner .since { font-family: var(--read); font-size: 14.5px; color: var(--on-dark-2); max-width: 460px; line-height: 1.6; }
.dbanner .crest { width: 78px; height: 78px; border: 1px solid rgba(236,227,209,0.3); border-radius: 50%; display: grid; place-items: center; text-align: center; }
.dbanner .crest .pc { font-family: var(--sans); font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--bronze-soft); line-height: 1.5; }

.dash { padding: 48px 0 84px; }
.dgrid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; align-items: start; }
.panel { background: var(--card); border: 1px solid var(--line-soft); border-radius: 4px; padding: 28px 30px; }
.panel-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.panel-h h3 { font-family: var(--sans); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.panel-h a { font-family: var(--read); font-size: 13px; color: var(--bronze); }

.ov-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1px solid var(--line-soft); border-radius: 4px; overflow: hidden; }
.ov { padding: 24px 22px; border-right: 1px solid var(--line-soft); }
.ov:last-child { border-right: none; }
.ov .ico { width: 26px; height: 26px; color: var(--bronze); margin-bottom: 14px; }
.ov .ico svg { width: 100%; height: 100%; }
.ov .v { font-family: var(--serif); font-size: 40px; font-weight: 600; color: var(--ink); line-height: 1; }
.ov .k { font-family: var(--sans); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
.ov .u { font-family: var(--read); font-size: 12.5px; color: var(--faint); margin-top: 2px; }

.act { display: flex; gap: 15px; padding: 16px 0; border-top: 1px solid var(--line-soft); }
.act:first-child { border-top: none; padding-top: 2px; }
.act .ai { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--bronze); flex: none; }
.act .ai svg { width: 18px; height: 18px; }
.act .ab { flex: 1; }
.act .ab .t { font-family: var(--read); font-size: 15px; color: var(--ink); }
.act .ab .s { font-family: var(--read); font-size: 13px; color: var(--muted); margin-top: 2px; }
.act .w { font-family: var(--sans); font-size: 11px; letter-spacing: 0.04em; color: var(--faint); }

.side-card + .side-card { margin-top: 24px; }
.qa { display: grid; gap: 10px; }
.qa a { display: flex; align-items: center; gap: 13px; padding: 15px 16px; border: 1px solid var(--line-soft); border-radius: 3px; transition: all .18s; }
.qa a:hover { border-color: var(--line); background: var(--card-2); }
.qa a svg { width: 18px; height: 18px; color: var(--bronze); flex: none; }
.qa a .qt { font-family: var(--read); font-size: 14.5px; color: var(--ink); flex: 1; }
.qa a .qg { color: var(--faint); } .qa a .qg svg { width: 16px; height: 16px; }

.rel-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
.rel-mini { display: block; }
.rel-mini .ph { aspect-ratio: 3/4; border-radius: 3px; overflow: hidden; position: relative; border: 1px solid var(--line-soft); }
.rel-mini .ph .t { position: absolute; inset: 0; }
.rel-mini .nm { font-family: var(--read); font-size: 13px; color: var(--ink); margin-top: 9px; line-height: 1.25; }
.rel-mini .pr { font-family: var(--serif); font-size: 14px; color: var(--muted); }

@media (max-width: 1080px) { .dgrid { grid-template-columns: 1fr; } .ov-grid { grid-template-columns: repeat(2,1fr); } .ov:nth-child(2){border-right:none;} .dbanner h1 { font-size: 38px; } }
</style>
</head>
<body>

<div id="m-header" data-active="" data-theme="dark"></div>

<section class="dbanner">
  <div class="wrap">
    <div>
      <div class="pclabel">Private Client</div>
      <h1 id="cname"></h1>
      <p class="since">This is your personal dossier  - a curated record of your journey with Monsieur by Aelier Groupe.</p>
    </div>
    <div class="crest"><span class="pc">Private<br />Client</span></div>
  </div>
</section>

<main class="wrap dash">
  <div class="panel" style="margin-bottom:24px;">
    <div class="panel-h"><h3>Client Overview</h3><span style="font-family:var(--read);font-size:13px;color:var(--muted)" id="cmeta"></span></div>
    <div class="ov-grid" id="ovGrid"></div>
  </div>

  <div class="dgrid">
    <div class="panel">
      <div class="panel-h"><h3>Recent Activity</h3><a href="#">View All</a></div>
      <div id="actList"></div>
    </div>
    <div>
      <div class="panel side-card">
        <div class="panel-h"><h3>Quick Access</h3></div>
        <div class="qa">
          <a href="made-to-measure.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 7l8-4 8 4-8 4-8-4Z"/><path d="M4 7v10l8 4 8-4V7"/></svg><span class="qt">Book a Fitting</span><span class="qg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 6l6 6-6 6"/></svg></span></a>
          <a href="wardrobe.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg><span class="qt">Wardrobe Archive</span><span class="qg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 6l6 6-6 6"/></svg></span></a>
          <a href="checkout.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 7h14l-1 13H6L5 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span class="qt">Atelier Orders</span><span class="qg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 6l6 6-6 6"/></svg></span></a>
          <a href="passport.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 4h11l3 3v13H5z"/><path d="M9 9h7M9 13h7M9 17h4"/></svg><span class="qt">Fibre Passports</span><span class="qg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 6l6 6-6 6"/></svg></span></a>
        </div>
      </div>
      <div class="panel side-card">
        <div class="panel-h"><h3>Private Releases</h3><a href="collections.html">View</a></div>
        <div class="rel-row" id="relRow"></div>
      </div>
    </div>
  </div>
</main>

<div id="m-footer"></div>

<script src="monsieur-data.js"></script>
<script src="chrome.js"></script>
<script src="backend-client.js"></script>
<script>
const isDark = t => t.includes('navy')||t.includes('black')||t.includes('charcoal')||t.includes('brown')||t.includes('olive');
document.getElementById('cname').textContent = DOSSIER.name;
document.getElementById('cmeta').textContent = 'Client since ' + DOSSIER.since;

const ovIco = {
  0:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>',
  1:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 3l8 4-8 4-8-4 8-4ZM4 7v10l8 4 8-4V7"/></svg>',
  2:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  3:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 3c3 3 6 4 6 4v5c0 4-3 7-6 9-3-2-6-5-6-9V7s3-1 6-4Z"/></svg>',
};
document.getElementById('ovGrid').innerHTML = DOSSIER.overview.map((o,i)=>`
  <div class="ov"><span class="ico">${ovIco[i]}</span><div class="v">${o.v}</div><div class="k">${o.k}</div><div class="u">${o.u}</div></div>`).join('');

const actIco = {
  order:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 7h14l-1 13H6L5 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>',
  release:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 3c3 3 6 4 6 4v5c0 4-3 7-6 9-3-2-6-5-6-9V7s3-1 6-4Z"/></svg>',
  measure:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 8h16v8H4zM8 8v3M12 8v4M16 8v3"/></svg>',
};
document.getElementById('actList').innerHTML = DOSSIER.activity.map(a=>`
  <div class="act"><span class="ai">${actIco[a.ico]}</span><div class="ab"><div class="t">${a.t}</div><div class="s">${a.s}</div></div><span class="w">${a.w}</span></div>`).join('');

const ward = MN.getWard();
const rel = (ward.length ? ward.slice(0,3) : GARMENTS.slice(0,3).map(g=>({id:g.id,name:g.name,tone:g.tone,price:g.price})));
document.getElementById('relRow').innerHTML = rel.map(r=>`
  <a class="rel-mini" href="product.html?id=${r.id}">
    <div class="ph"><div class="t ${isDark(r.tone)?'photo':'tex'} ${r.tone}"></div></div>
    <div class="nm">${r.name}</div><div class="pr">${fmtPrice(r.price)}</div>
  </a>`).join('');
</script>
</body>
</html>

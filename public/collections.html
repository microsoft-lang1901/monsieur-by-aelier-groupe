<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Collections  - Monsieur</title>
<link rel="stylesheet" href="monsieur.css" />
<style>
.cbanner { position: relative; overflow: hidden; border-bottom: 1px solid var(--line-soft); background: var(--paper-2); }
.cbanner .wrap { position: relative; padding: 56px 44px 44px; }
.crumb { font-family: var(--sans); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); margin-bottom: 22px; display: flex; gap: 9px; }
.crumb a:hover { color: var(--ink-2); }
.crumb b { color: var(--ink-2); font-weight: 400; }
.cbanner h1 { font-family: var(--serif); font-weight: 500; font-size: 56px; line-height: 1; letter-spacing: -0.01em; color: var(--ink); }
.cbanner p { font-family: var(--read); font-size: 15.5px; color: var(--ink-2); margin-top: 14px; max-width: 540px; line-height: 1.65; }

.ctrl { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 28px 0; flex-wrap: wrap; }
.chips { display: flex; gap: 9px; flex-wrap: wrap; }
.chip { font-family: var(--sans); font-size: 11.5px; letter-spacing: 0.08em; padding: 10px 18px; border-radius: 40px; background: transparent; border: 1px solid var(--line); color: var(--ink-2); cursor: pointer; transition: all .18s; }
.chip:hover { border-color: var(--line-strong); color: var(--ink); }
.chip.on { background: var(--dark); border-color: var(--dark); color: var(--on-dark); }
.sortsel { position: relative; }
.sortsel select { -webkit-appearance: none; appearance: none; font-family: var(--sans); font-size: 12px; letter-spacing: 0.04em; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 40px; padding: 10px 38px 10px 18px; cursor: pointer; outline: none; }
.sortsel select:hover { border-color: var(--line-strong); }
.sortsel svg { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; color: var(--muted); pointer-events: none; }

.cgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; padding-bottom: 90px; }
.count { font-family: var(--sans); font-size: 12px; letter-spacing: 0.04em; color: var(--muted); padding: 4px 0 20px; }
.count b { color: var(--ink); font-weight: 500; }

@media (max-width: 1080px) { .cgrid { grid-template-columns: repeat(2, 1fr); } .cbanner h1 { font-size: 42px; } }
</style>
</head>
<body>

<div id="m-header" data-active="collections"></div>

<section class="cbanner">
  <div class="wrap">
    <div class="crumb"><a href="home.html">Home</a><span>/</span><b>Collections</b></div>
    <h1>The Collection</h1>
    <p>The seasonal soul of the house  - tailoring, knitwear, shirting and outerwear, each rendered in its truest material.</p>
  </div>
</section>

<div class="wrap">
  <div class="ctrl">
    <div class="chips" id="chips"></div>
    <div class="sortsel">
      <select id="sort">
        <option value="featured">Featured</option>
        <option value="price-asc">Price · Low to High</option>
        <option value="price-desc">Price · High to Low</option>
        <option value="name">Alphabetical</option>
      </select>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>
  </div>
  <div class="count"><b id="count">0</b> pieces</div>
  <div class="cgrid" id="grid"></div>
</div>

<div id="m-footer"></div>

<script src="monsieur-data.js"></script>
<script src="chrome.js"></script>
<script src="backend-client.js"></script>
<script>
const cats = ['All', ...new Set(GARMENTS.map(g => g.cat))];
let cat = 'All', sort = 'featured';
const ward = new Set(MN.getWard().map(w => w.id));

document.getElementById('chips').innerHTML = cats.map(c => `<span class="chip ${c===cat?'on':''}" data-c="${c}">${c}</span>`).join('');

function isDark(t){ return t.includes('navy')||t.includes('black')||t.includes('charcoal')||t.includes('brown')||t.includes('olive'); }

function render(){
  let list = GARMENTS.filter(g => cat==='All' || g.cat===cat);
  if (sort==='price-asc') list.sort((a,b)=>a.price-b.price);
  else if (sort==='price-desc') list.sort((a,b)=>b.price-a.price);
  else if (sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
  document.getElementById('count').textContent = list.length;
  document.getElementById('grid').innerHTML = list.map(g => `
    <a class="gcard" href="product.html?id=${g.id}">
      <div class="ph ${g.editorial?'has-editorial':g.board?'has-board':''}">${g.editorial?`<img class="editorial-img" src="${g.editorial[0].src}" alt="${g.name} ${g.editorial[0].label}" loading="lazy" />`:g.board?`<img class="board-img" src="${g.board}" alt="${g.name} product board" loading="lazy" />`:`<div class="${isDark(g.tone)?'photo':'tex'} ${g.tone}"></div>`}
        ${g.tagline?`<span class="tagline">${g.tagline}</span>`:''}
        <button class="save ${ward.has(g.id)?'on':''}" data-save="${g.id}" aria-label="Save">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
        </button>
      </div>
      <div class="gb"><div class="house">${g.house}</div><h4>${g.name}</h4><div class="meta">${g.material} · ${g.color}</div><div class="price">${fmtPrice(g.price)}</div></div>
    </a>`).join('');
  document.querySelectorAll('[data-save]').forEach(b => b.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    const g = findGarment(b.dataset.save);
    if (ward.has(g.id)) { MN.removeWard(g.id); ward.delete(g.id); b.classList.remove('on'); }
    else { MN.addWard({id:g.id,name:g.name,house:g.house,tone:g.tone,material:g.material,price:g.price}); ward.add(g.id); b.classList.add('on'); }
  }));
}
render();
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { cat=c.dataset.c; document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.c===cat)); render(); }));
document.getElementById('sort').addEventListener('change', e => { sort=e.target.value; render(); });
</script>
</body>
</html>
